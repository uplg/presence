[package]
name = "presence"
version = "0.2.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "time", "signal"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
lettre = { version = "0.11.23", default-features = false, features = ["tokio1-native-tls", "builder", "smtp-transport", "hostname"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
rand = "0.10.3"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = true
